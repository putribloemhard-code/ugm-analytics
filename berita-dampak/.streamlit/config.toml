# Konfigurasi server Streamlit untuk dashboard_berita_dampak.py.
#
# maxUploadSize ini GLOBAL per proses server -- berlaku untuk SEMUA
# st.file_uploader di seluruh app (Dampak/Dampak x SDGs/SDGs/Akreditasi),
# bukan cuma upload file pendukung akreditasi. Saat file ini ditambahkan
# (2026-09-16), st.file_uploader HANYA dipakai di halaman Akreditasi
# (upload file pendukung, lihat akreditasi/scripts/upload_akreditasi.py)
# jadi tidak ada trade-off nyata dengan fitur lain -- tapi kalau nanti ada
# uploader baru di halaman lain yang butuh file >25 MB, nilai ini perlu
# dinaikkan di sini juga (tidak bisa diset per-widget).
#
# Default Streamlit tanpa file ini adalah 200 MB; 25 MB di sini SENGAJA
# lebih kecil (dibatasi sesuai kebutuhan upload dokumen akreditasi
# PDF/Word/Excel) supaya user tidak tidak sengaja upload file raksasa yang
# bikin proses ekstraksi (Tahap 2/3) lambat/gagal.
[server]
maxUploadSize = 25
# Sajikan berita-dampak/static/ di URL app/static/ -- dipakai gambar hero
# Beranda (hero_bg.jpg), supaya gambar ~150 KB itu di-cache browser dan
# tidak dikirim ulang sbg base64 di setiap rerun halaman.
enableStaticServing = true

# Sidebar bernuansa navy background.png (hero Beranda) -- kode warnanya
# DIAMBIL LANGSUNG dari gambarnya: #00214a = sisi kiri yang gelap polos,
# #0a3364 = sisi kanan (siluet Balairung). Ditulis DUA
# kali -- [theme.light.sidebar] dan [theme.dark.sidebar] -- supaya app tetap
# mengikuti preferensi terang/gelap sistem; kalau hanya [theme.sidebar] yang
# diisi, Streamlit menganggap ada satu tema kustom saja dan mengunci tampilan
# ke mode terang.
[theme.light.sidebar]
backgroundColor = "#00214a"
secondaryBackgroundColor = "#0a3364"
textColor = "#e9effb"
primaryColor = "#ffc72c"
borderColor = "rgba(255,255,255,0.16)"

[theme.dark.sidebar]
backgroundColor = "#001a3c"
secondaryBackgroundColor = "#082b57"
textColor = "#e9effb"
primaryColor = "#ffc72c"
borderColor = "rgba(255,255,255,0.16)"
