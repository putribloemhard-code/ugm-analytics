name: ugm-analytics

# Kontrak variabel: SEMUA variabel di bawah WAJIB ada di deploy/.env.
# Sintaks ${VAR:?pesan} di tiap pemakaian membuat `docker compose config/up` GAGAL
# dengan pesan jelas kalau nilainya kosong, alih-alih diam-diam memakai string kosong
# (dulu berujung postgres gagal boot tanpa sebab yang terbaca).
#   COMPOSE_PROJECT_NAME  UGM_ANALYTICS_BIND_ADDRESS  UGM_ANALYTICS_PORT  PUBLIC_ORIGIN
#   VITE_API_BASE_URL  VITE_APP_BASE_PATH
#   POSTGRES_DB  POSTGRES_USER  POSTGRES_PASSWORD
#   SOURCE_MYSQL_DB  SOURCE_MYSQL_USER  SOURCE_MYSQL_PASSWORD  SOURCE_MYSQL_ROOT_PASSWORD

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB belum diisi di deploy/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER belum diisi di deploy/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi di deploy/.env}"
    volumes:
      - ../runtime/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mysql-reader:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_DATABASE: "${SOURCE_MYSQL_DB:?SOURCE_MYSQL_DB belum diisi di deploy/.env}"
      MYSQL_USER: "${SOURCE_MYSQL_USER:?SOURCE_MYSQL_USER belum diisi di deploy/.env}"
      MYSQL_PASSWORD: "${SOURCE_MYSQL_PASSWORD:?SOURCE_MYSQL_PASSWORD belum diisi di deploy/.env}"
      MYSQL_ROOT_PASSWORD: "${SOURCE_MYSQL_ROOT_PASSWORD:?SOURCE_MYSQL_ROOT_PASSWORD belum diisi di deploy/.env}"
    volumes:
      - ../runtime/mysql-reader-v2:/var/lib/mysql
      - ../migration-input/analytics.reader.sql:/docker-entrypoint-initdb.d/analytics.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER belum diisi di deploy/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi di deploy/.env}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB belum diisi di deploy/.env}"
      API_CORS_ORIGINS: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN belum diisi di deploy/.env}"
      ACCREDITATION_UPLOAD_DIR: /app/data/accreditation/uploads
      # Untuk migrate_mysql_to_postgres.py yang dijalankan via `docker compose run`:
      # api wajib tahu kredensial sumber MySQL, bukan cuma target Postgres.
      SOURCE_MYSQL_HOST: mysql-reader
      SOURCE_MYSQL_PORT: "3306"
      SOURCE_MYSQL_DB: "${SOURCE_MYSQL_DB:?SOURCE_MYSQL_DB belum diisi di deploy/.env}"
      SOURCE_MYSQL_USER: "${SOURCE_MYSQL_USER:?SOURCE_MYSQL_USER belum diisi di deploy/.env}"
      SOURCE_MYSQL_PASSWORD: "${SOURCE_MYSQL_PASSWORD:?SOURCE_MYSQL_PASSWORD belum diisi di deploy/.env}"
    volumes:
      - ../runtime/accreditation-uploads:/app/data/accreditation/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mysql-reader:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:?VITE_API_BASE_URL belum diisi di deploy/.env}"
        VITE_APP_BASE_PATH: "${VITE_APP_BASE_PATH:?VITE_APP_BASE_PATH belum diisi di deploy/.env}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${UGM_ANALYTICS_BIND_ADDRESS:?UGM_ANALYTICS_BIND_ADDRESS belum diisi di deploy/.env}:${UGM_ANALYTICS_PORT:?UGM_ANALYTICS_PORT belum diisi di deploy/.env}:8092"
    volumes:
      - ./edge-nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/analytics/ | grep -q '<div id=\"root\"' "]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  internal:
    name: "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME belum diisi di deploy/.env}_internal"
    driver: bridge
