<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analisis dampak UGM berdasarkan Kepmen 361/M/KEP/2025 dan SDGs." />
    <title>UGM Analytics</title>
    <link rel="icon" type="image/png" href="/logo/LogoUGM.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Terapkan tema tersimpan (atau preferensi sistem) sebelum render agar tidak berkedip.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('ugm-analytics-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
