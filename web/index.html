<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analisis dampak UGM berdasarkan Kepmen 361/M/KEP/2025 dan SDGs." />
    <title>UGM Analytics</title>
    <link rel="icon" type="image/png" href="/logo/LogoUGM.png" />
    <meta name="color-scheme" content="light" />
    <script>
      // Tampilan selalu terang (tombol mode gelap/terang dihapus). Diset sebelum render supaya
      // pilihan "dark" lama di localStorage atau tema gelap OS tidak ikut terpakai.
      document.documentElement.dataset.theme = 'light';
      try { localStorage.removeItem('ugm-analytics-theme'); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
